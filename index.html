<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>

    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="pomodoro">
      <header class="pomodoro-header">
        <h1>Pomodoro Timer</h1>
        <p>Gerencie seus ciclos de foco e descanso</p>
      </header>
      <div class="mode-selector">
    <button class="active">Foco</button>
    <button>Pausa Curta</button>
    <button>Pausa Longa</button>
</div>

      <section class="timer-container">
        <!-- Tempo de trabalho -->
        <article class="timer-card work-card">
          <h2 id="timeof">Trabalho</h2>

          <div
            id="timer-work"
           class="timer-circle""
            aria-label="Tempo de trabalho"
          >
            25:00
          </div>
          <span>Foco</span>

          <div class="timer-controls">
            <button
              id="work-decrease"
              type="button"
              aria-label="Diminuir tempo de trabalho"
            >
              -
            </button>
            

            <button
              id="work-increase"
              type="button"
              aria-label="Aumentar tempo de trabalho"
            >
              +
            </button>
          </div>
        </article>

        <!-- Tempo de descanso -->
        <article class="timer-card break-card">
          <h2>Descanso</h2>

          <div
            id="timer-break"
            class="timer-display"
            aria-label="Tempo de descanso"
          >
            
          </div>

          <div class="timer-controls">
            <button
              id="break-decrease"
              type="button"
              aria-label="Diminuir tempo de descanso"
            >
              -
            </button>

            <button
              id="break-increase"
              type="button"
              aria-label="Aumentar tempo de descanso"
            >
              +
            </button>
          </div>
        </article>
      </section>

      <section class="actions">
        <button id="start-button">
            ▶ Iniciar
        </button>
        

        <button id="reset-button" class="action-button reset" type="button">
          Reiniciar
        </button>
      </section>
    </main>
    <section class="playlist-section">
        <h2>🎵 Playlists para Estudar</h2>

        <div class="playlist-grid">
            <div class="playlist-card">
                <img src="img/lofi.jpg">
                <span>Lofi Hip Hop</span>
            </div>

            <div class="playlist-card">
                <img src="img/classica.jpg">
                <span>Música Clássica</span>
            </div>
        </div>
    </section>

    <script src="assets/script.js"></script>
  </body>
</html>
