<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/styles.css" />

    <title>Pomodoro Timer</title>
  </head>
  <body>
    <div class="main-container">
      <!-- SEÇÃO POMODORO -->
      <main class="pomodoro">
        <header class="pomodoro-header">
          <h1>🍅 Pomodoro Timer</h1>
          <p>Gerencie seus ciclos de foco e descanso</p>
          <div class="mode-selector">
            <button id="foco" class="active">Foco</button>
            <button id="pausa_curta">Pausa Curta: 5 min</button>
            <button id="pausa_longa">Pausa Longa: 10 min</button>
          </div>
        </header>

        <section class="timer-container">
          <article class="timer-card work-card">
            <h2 id="timeof">Trabalho</h2>
            <div
              id="timer-work"
              class="timer-circle"
              aria-label="Tempo de trabalho"
            >
              25:00
            </div>
            <span>⚡ Foco</span>
            <div class="timer-controls">
              <button id="work-decrease" type="button">-</button>

              <button id="work-increase" type="button">+</button>
            </div>
          </article>

          <article class="timer-card break-card">
            <h2>Descanso</h2>
            <div
              id="timer-break"
              class="timer-display"
              aria-label="Tempo de descanso"
            >
              05:00
            </div>
            <span>☕ Relaxe</span>
            <div class="timer-controls">
              <button id="break-decrease" type="button">-</button>
              <span id="break-label" class="time-label">5 min</span>
              <button id="break-increase" type="button">+</button>
            </div>
          </article>
        </section>

        <section class="actions">
          <button id="start-button">▶ Iniciar</button>
          <button id="reset-button" class="action-button reset" type="button">
            ⟳ Reiniciar
          </button>
        </section>
      </main>

      <!-- SEÇÃO PLAYLIST DO YOUTUBE COM INPUT PERSONALIZADO -->
      <section class="playlist-section">
        <h2>🎵 Playlists para Estudar</h2>

        <!-- NOVA SEÇÃO: INPUT PARA LINK PERSONALIZADO -->
        <div class="custom-playlist">
          <h3>🔗 Ouça sua própria playlist</h3>
          <div class="input-group">
            <input
              type="text"
              id="playlist-url"
              placeholder="Cole o link do YouTube (vídeo ou playlist)..."
              class="url-input"
            />
            <button id="load-playlist-btn" class="load-btn">🎵 Carregar</button>
          </div>
          <p class="helper-text">
            Suporta: links de vídeo, playlists e canais do YouTube
          </p>
        </div>

        <div class="divider">
          <span>ou escolha uma categoria</span>
        </div>

        <div class="playlist-categories">
          <button class="category-btn active" data-category="lofi">
            🎧 Lofi Hip Hop
          </button>
          <button class="category-btn" data-category="classical">
            🎻 Música Clássica
          </button>
          <button class="category-btn" data-category="rock">
            🤘 Rock Instrumental
          </button>
          <button class="category-btn" data-category="jazz">
            🎷 Jazz Suave
          </button>
          <button class="category-btn" data-category="nature">
            🌊 Sons da Natureza
          </button>
        </div>

        <div class="playlist-container">
          <div id="youtube-player"></div>
        </div>

        <div class="playlist-info">
          <p id="current-playlist">🎵 Tocando: Lofi Hip Hop</p>
        </div>
      </section>
    </div>

    <script src="assets/script.js"></script>
  </body>
</html>
